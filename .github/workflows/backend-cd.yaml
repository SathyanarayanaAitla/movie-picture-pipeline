name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yaml"
  workflow_dispatch:

jobs:
  backend-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build \
            -t 048186233838.dkr.ecr.us-east-1.amazonaws.com/backend:latest \
            starter/backend

      - name: Push backend Docker image
        run: |
          docker push \
            048186233838.dkr.ecr.us-east-1.amazonaws.com/backend:latest

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Deploy backend to EKS
        run: |
          kubectl apply -k starter/backend/k8s

      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s || true
          echo "----- Logging - kubectl get all -----"
          kubectl get all
          echo "----- Logging - kubectl describe deploy -----"
          kubectl describe deploy backend

      - name: Verify Backend ECR image
        run: |
          echo "----- Backend ECR Image Details -----"
          AWS_PAGER="" aws ecr describe-images \
            --repository-name backend \
            --region us-east-1 \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].{Tags:imageTags,Digest:imageDigest,PushedAt:imagePushedAt}' \
            --output table